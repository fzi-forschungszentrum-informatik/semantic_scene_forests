name: Verify, Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "04 23 * * *"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
    steps:
      - uses: actions/checkout@v7
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: |
          sudo apt-get update
          sudo apt-get install -y pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  industrial_ci:
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [lyrical]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.distro }}
          ROS_REPO: main
          # oai-api/CPR needs development headers, not just the curl executable.
          # The Rust bindings additionally need the toolchain and bindgen's libclang.
          ADDITIONAL_DEBS: libssl-dev libcurl4-openssl-dev cargo rustc rustfmt libclang-dev python3-pip
          BASEDIR: ${{ github.workspace }}/.build
          UPSTREAM_WORKSPACE: upstream_workspace.yaml
          # oai_api: built upstream as plain CMake; rosdep cannot discover it as an ament package.
          # ament_cargo: a colcon build type (colcon-ros-cargo), not a rosdep key.
          ROSDEP_SKIP_KEYS: oai_api ament_cargo
          BEFORE_INSTALL_TARGET_DEPENDENCIES: pip3 install --break-system-packages colcon-cargo colcon-ros-cargo cargo-ament-build
      - name: Make build outputs readable
        if: always()
        # Docker builds leave root-owned files (e.g. cxxbridge headers) the artifact glob cannot stat.
        run: sudo chmod -R a+rX .build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test Results (ROS ${{ matrix.distro }})
          path: |
            .build/target_ws/build/**/test_results/**/*.xml
            .build/target_ws/build/**/pytest.xml
            .build/target_ws/build/**/*xunit.xml
          include-hidden-files: true
          if-no-files-found: warn
