---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: fix-byte-order-marker # Forbid UTF-8 byte-order markers
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        additional_dependencies: [pyyaml>=5.1]
        args: [--disabled-codes=C0301]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
        exclude: "html/"
      - id: forbid-tabs
        exclude: "html/"
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5  # check for latest
    hooks:
      - id: insert-license
        name: Add license header
        args:
          - --license-filepath=LICENSE
          - --comment-style=//
          - --allow-past-years
          - --use-current-year
          - --fuzzy-match-generates-todo
        types_or: [c, c++, rust]
      - id: insert-license
        name: Add license header (Python, CMake, Yaml)
        args:
          - --license-filepath=LICENSE
          - --comment-style=#
          - --allow-past-years
          - --use-current-year
          - --fuzzy-match-generates-todo
        types_or: [python, cmake, yaml]
      - id: insert-license
        name: Add license header (Jinja)
        args:
          - --license-filepath=LICENSE
          - --comment-style={#||#}
          - --allow-past-years
          - --use-current-year
          - --fuzzy-match-generates-todo
        types: [jinja]
      - id: insert-license
        name: Add license header (XML)
        types: [xml]
        args:
          - --license-filepath=LICENSE
          - --comment-style=<!--| |-->
          - --insert-license-after-regex=<\?xml-model
          - --allow-past-years
          - --use-current-year
          - --fuzzy-match-generates-todo
