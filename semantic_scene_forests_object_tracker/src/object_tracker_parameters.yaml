object_tracker:
  camera_names:
    type: string_array
    default_value: ["default"]
    description: "Named camera pipelines; each camera has independent synchronized inputs."
    read_only: true
    validation:
      not_empty<>: []
      unique<>: []
  cameras:
    __map_camera_names:
      detections_2d_topic:
        type: string
        default_value: "detections_2d"
        description: "2D detections for this camera."
        read_only: true
        validation:
          not_empty<>: []
      detections_3d_topic:
        type: string
        default_value: "detections_3d"
        description: "3D detections for this camera."
        read_only: true
        validation:
          not_empty<>: []
      image_topic:
        type: string
        default_value: "camera/image"
        description: "Image synchronized with this camera's detections."
        read_only: true
        validation:
          not_empty<>: []
  world_frame:
    type: string
    default_value: "map"
    description: "Target coordinate frame for all tracked 3D bounding boxes."
    read_only: true
  max_trackable_objects:
    type: int
    default_value: 1000
    description: "Maximum tentative and recent tracks; remembered objects do not count."
    read_only: true
    validation:
      gt<>: [0]
  gate_threshold_strict:
    type: double
    default_value: 3.0
    description: "Mahalanobis distance threshold for matching against unconfirmed tracks (strict gate)."
    validation:
      gt<>: [0.0]
  gate_threshold_confirmed:
    type: double
    default_value: 10.0
    description: "Mahalanobis distance threshold for matching against confirmed tracks (relaxed gate)."
    validation:
      gt<>: [0.0]
  confidence_threshold:
    type: double
    default_value: 0.8
    description: "Minimum detection confidence score to accept a detection."
    validation:
      bounds<>: [0.0, 1.0]
  reacquisition_timeout:
    type: double
    default_value: 5.0
    description: "Observation age in seconds after which a confirmed track is stale (reactivated or replaced on revisit)."
    validation:
      gt<>: [0.0]
  max_association_distance:
    type: double
    default_value: 0.5
    description: "Hard center-distance association limit in meters, in addition to Mahalanobis gating."
    validation:
      gt<>: [0.0]
  replacement_overlap_threshold:
    type: double
    default_value: 0.5
    description: "Fraction of a stale track's box a confirmed recent track must cover to replace it when the arbiter is disabled or failed."
    validation:
      bounds<>: [0.0, 1.0]
  bbox_size_alpha:
    type: double
    default_value: 0.2
    description: "Measurement weight in world-AABB dimension filtering."
    validation:
      gt<>: [0.0]
      lt_eq<>: [1.0]
  measurement_noise_std:
    type: double
    default_value: 0.4
    description: "Standard deviation for Kalman filter measurement noise (R matrix)."
    validation:
      gt<>: [0.0]
  process_noise_std:
    type: double
    default_value: 0.05
    description: "Standard deviation for Kalman filter process noise (Q matrix)."
    validation:
      gt<>: [0.0]
  confirmation_threshold:
    type: int
    default_value: 3
    description: "Number of observations required before a track is confirmed."
    validation:
      gt<>: [0]
  unconfirmed_track_timeout:
    type: double
    default_value: 30.0
    description: "Seconds after last observation before an unconfirmed track is deleted."
    validation:
      gt<>: [0.0]
  merge_overlap_threshold:
    type: double
    default_value: 0.5
    description: "Minimum intersection over the smaller box volume for two similar-sized tracks (or same-frame detections) to be one object."
    validation:
      bounds<>: [0.0, 1.0]
  overlap_min_extent:
    type: double
    default_value: 0.1
    description: "Box extents are padded to this size (m) before computing overlaps; depth yields near-zero extents along the viewing ray."
    validation:
      gt<>: [0.0]
  class_whitelist:
    type: string_array
    default_value: []
    description: "If non-empty, only track objects with these class names. Empty means track all."
    read_only: true
    validation:
      unique<>: []
  crop_padding:
    type: int
    default_value: 10
    description: "Pixels of padding to add around cropped image patches."
    validation:
      gt_eq<>: [0]
  max_crops_per_object:
    type: int
    default_value: 5
    description: "Maximum number of cropped image patches to store per tracked object."
    validation:
      gt<>: [0]
  snapshot_rate_hz:
    type: double
    default_value: 2.0
    description: "Snapshot publish rate. 0 publishes after every synchronized camera frame."
    read_only: true
    validation:
      gt_eq<>: [0.0]
  association_max_size_ratio:
    type: double
    default_value: 2.0
    description: "Maximum ratio of the largest world-AABB dimensions for two boxes to count as a similar object (association, merge, reactivation)."
    validation:
      gt_eq<>: [1.0]
  arbiter:
    enabled:
      type: bool
      default_value: false
      description: "Ask the Decisions API whether partially overlapping tracks are the same object (last resort)."
      read_only: true
    server_url:
      type: string
      default_value: "https://openrouter.ai/api/alpha"
      description: "OpenRouter Decisions API base URL."
      read_only: true
    api_key:
      type: string
      default_value: ""
      description: "API key for the Decisions API."
      read_only: true
    model:
      type: string
      default_value: "openai/gpt-6-luna-decisions"
      description: "Decisions model."
      read_only: true
    extra_body:
      type: string
      default_value: ""
      description: "JSON object merged into every Decisions request body, e.g. OpenRouter provider routing. Empty sends nothing extra."
      read_only: true
    request_timeout_seconds:
      type: int
      default_value: 60
      description: "Maximum time allowed for one Decisions HTTP request."
      read_only: true
      validation:
        gt<>: [0]
    min_interval_seconds:
      type: double
      default_value: 1.0
      description: "Minimum wall-clock time between two Decisions requests."
      validation:
        gt_eq<>: [0.0]
    min_overlap:
      type: double
      default_value: 0.1
      description: "Pairs with overlap in (min_overlap, merge_overlap_threshold) are ambiguous and may be arbitrated."
      validation:
        bounds<>: [0.0, 1.0]
    same_object_probability:
      type: double
      default_value: 0.8
      description: "Minimum same-object probability to merge an arbitrated pair."
      validation:
        bounds<>: [0.0, 1.0]
